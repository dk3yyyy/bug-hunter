name: Deploy landing page
on:
  push:
    branches: [main]
    paths:
      - "src/render/landing.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build landing page
        run: |
          mkdir -p dist
          node -e 'const fs=require("fs");let h=fs.readFileSync("src/render/landing.html","utf8");h=h.replace(/href="#"/g,"href=\"https://github.com/dk3yyyy/bug-hunter\"");fs.writeFileSync("dist/index.html",h);'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
