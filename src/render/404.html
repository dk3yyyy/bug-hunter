<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#100d15">
<title>Bug Hunter — Page not found</title>
<meta name="description" content="This URL does not exist on the Bug Hunter site.">
<meta name="robots" content="noindex">
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Red+Hat+Display:wght@900&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100d15;--ink:#ece6dc;--muted:#a396ad;--dim:#8f8399;--line:#322a3d;
    --amber:#e9a15f;--lilac:#cbb8f0;
    --display:"Red Hat Display",system-ui,sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
    --body:"Red Hat Text",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
    color:var(--ink);font:16px/1.65 var(--body);
    background:radial-gradient(circle at 1px 1px,rgba(236,230,220,.05) 1px,transparent 0) 0 0/26px 26px,var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  main{width:min(760px,100%)}
  .brand{display:inline-flex;gap:.3rem;font:900 1rem/1 var(--display);text-transform:uppercase;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .brand .mark{color:var(--amber)}
  .eyebrow{display:block;margin:2.2rem 0 .9rem;font:500 .68rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .eyebrow b{color:var(--amber);font-weight:500}
  h1{margin:0;font:900 clamp(2.2rem,7vw,3.8rem)/.98 var(--display);text-transform:uppercase;letter-spacing:-.04em}
  h1 em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;color:var(--amber)}
  p.lede{color:var(--muted);max-width:52ch;margin:1rem 0 0}
  .row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}
  .btn{display:inline-flex;align-items:center;min-height:46px;padding:.75rem 1.3rem;border-radius:999px;background:var(--amber);color:#191220;border:1px solid var(--amber);font:700 .9rem/1 var(--body);text-decoration:none}
  .btn-ghost{display:inline-flex;align-items:center;min-height:46px;padding:.75rem 1.2rem;border-radius:999px;border:1px solid var(--line);color:var(--ink);font:500 .9rem/1 var(--body);text-decoration:none}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
  .foot{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font:500 .64rem/1.8 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .foot a{color:var(--muted);text-decoration:none}
  .foot a:hover{color:var(--amber)}
</style>
</head>
<body>
<main>
  <a class="brand" href="{{base}}">Bug<span class="mark">✳</span>Hunter</a>
  <span class="eyebrow"><b>404</b> · nothing haunts this URL</span>
  <h1>This page is a <em>ghost.</em></h1>
  <p class="lede">The URL you followed does not exist on this site. It may have moved, or it may never have been here at all.</p>
  <div class="row">
    <a class="btn" href="{{base}}">Back to the landing</a>
    <a class="btn-ghost" href="{{connect}}">Connect a repo</a>
    <a class="btn-ghost" href="https://github.com/dk3yyyy/bug-hunter/tree/main/docs">Read the docs</a>
  </div>
  <p class="foot"><a href="https://github.com/dk3yyyy/bug-hunter">GitHub</a> · <a href="https://github.com/dk3yyyy/bug-hunter/blob/main/SECURITY.md">Security</a> · <a href="https://github.com/dk3yyyy/bug-hunter/blob/main/LICENSE">MIT</a></p>
</main>
</body>
</html>
