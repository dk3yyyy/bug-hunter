# Render Blueprint — deploys Bug Hunter as a Docker web service.
#
#   1. Push this repo to GitHub (already done).
#   2. Render dashboard → New → Blueprint → pick this repo.
#   3. Fill the `sync: false` secrets in the dashboard when prompted.
#   4. After the first deploy, put the service URL into the Pages build so the
#      public button points here:
#        gh variable set APP_URL --repo dk3yyyy/bug-hunter --body https://<service>.onrender.com
#        gh workflow run deploy-pages.yml
#
# PUBLIC_URL is not set here: the server derives it from RENDER_EXTERNAL_URL,
# which Render injects automatically, so webhooks register correctly on a first
# deploy. Override it only for a custom domain.
#
# Note: the free plan sleeps after inactivity and drops in-memory hunts on
# restart. Upgrade the plan if GitHub webhooks must always be answered promptly.
services:
  - type: web
    name: bug-hunter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      # GitHub auth. Use pat to get going; switch to app once the GitHub App
      # exists (then set GITHUB_APP_ID, GITHUB_APP_SLUG, GITHUB_PRIVATE_KEY).
      - key: GITHUB_MODE
        value: pat
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      # Guards /api/hunt and /api/connect. Autogenerated; paste the same value
      # into the /connect form when you connect a repo by hand.
      - key: N8N_SHARED_SECRET
        generateValue: true
      # Model access: google (default) uses the Gemini key; set LLM_PROVIDER +
      # LLM_API_KEY + LLM_MODEL_REVIEW for Anthropic/OpenAI/DeepSeek/etc.
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: LANDING_REPO_URL
        value: https://github.com/dk3yyyy/bug-hunter
